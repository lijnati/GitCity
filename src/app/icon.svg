<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 20 20">
  <!-- The header logo mark: a 2×2 block plan with one tower. Colours follow the browser theme. -->
  <style>
    .ink { fill: #151515; }
    .tower { fill: #d6401f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #edebe6; }
      .tower { fill: #ee6a45; }
    }
  </style>
  <rect class="ink" x="1" y="9" width="8" height="10" />
  <rect class="tower" x="11" y="1" width="8" height="18" />
  <rect class="ink" x="1" y="1" width="8" height="6" opacity="0.35" />
</svg>
